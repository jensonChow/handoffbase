<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#C99B57"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8A7A5F"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1920" height="1080" fill="#171209"/>

  <!-- title -->
  <text x="64" y="92" font-size="40" font-weight="700" fill="#F2E7D5">HandoffBase</text>
  <text x="368" y="92" font-size="40" font-weight="300" fill="#8A7A5F">— open memory handoff for AI agents</text>
  <text x="64" y="130" font-size="19" fill="#B3A186" font-family="'SF Mono', Menlo, Consolas, monospace">MCP-native · Qwen-backed · traceable · governed</text>
  <text x="1856" y="92" font-size="14" fill="#8A7A5F" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace">architecture · July 2026</text>

  <!-- ============ MCP HOSTS ============ -->
  <rect x="64" y="200" width="264" height="428" rx="14" fill="#201810" stroke="#372B1C" stroke-width="1.5"/>
  <text x="88" y="240" font-size="13" letter-spacing="2.5" fill="#F0A64B" font-family="'SF Mono', Menlo, Consolas, monospace">MCP HOSTS</text>

  <g font-size="19" fill="#F2E7D5">
    <rect x="88" y="264" width="216" height="70" rx="10" fill="#2A2015" stroke="#44351F"/>
    <circle cx="112" cy="299" r="4" fill="#8FBF8A"/>
    <text x="130" y="306">Codex</text>

    <rect x="88" y="350" width="216" height="70" rx="10" fill="#2A2015" stroke="#44351F"/>
    <circle cx="112" cy="385" r="4" fill="#8FBF8A"/>
    <text x="130" y="392">Claude Code</text>

    <rect x="88" y="436" width="216" height="70" rx="10" fill="#2A2015" stroke="#44351F"/>
    <circle cx="112" cy="471" r="4" fill="#8FBF8A"/>
    <text x="130" y="478">Cursor</text>

    <rect x="88" y="522" width="216" height="70" rx="10" fill="#2A2015" stroke="#44351F"/>
    <circle cx="112" cy="557" r="4" fill="#8FBF8A"/>
    <text x="130" y="564">Custom MCP host</text>
  </g>
  <text x="88" y="606" font-size="13" fill="#8A7A5F">different agents, one shared memory</text>

  <!-- host arrows converge to caddy -->
  <g stroke="#6B5A41" stroke-width="1.8" fill="none">
    <path d="M 304 299 C 360 299, 360 375, 408 400" marker-end="url(#arrowDim)"/>
    <path d="M 304 385 C 350 385, 360 400, 406 412" marker-end="url(#arrowDim)"/>
    <path d="M 304 471 C 350 471, 360 448, 406 432" marker-end="url(#arrowDim)"/>
    <path d="M 304 557 C 360 557, 360 470, 408 444" marker-end="url(#arrowDim)"/>
  </g>

  <!-- ============ EDGE ============ -->
  <rect x="412" y="380" width="164" height="84" rx="12" fill="#2A2015" stroke="#44351F" stroke-width="1.5"/>
  <text x="494" y="416" font-size="18" fill="#F2E7D5" text-anchor="middle">Caddy HTTPS</text>
  <text x="494" y="440" font-size="12.5" fill="#8A7A5F" text-anchor="middle">TLS termination</text>
  <text x="494" y="500" font-size="12.5" fill="#B3A186" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">streamable HTTP</text>
  <text x="494" y="520" font-size="12.5" fill="#B3A186" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">+ API-key auth</text>

  <line x1="576" y1="422" x2="636" y2="422" stroke="#C99B57" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- ============ HANDOFFBASE SERVER ============ -->
  <rect x="640" y="200" width="600" height="680" rx="14" fill="#201810" stroke="#4A3A24" stroke-width="2"/>
  <text x="664" y="240" font-size="13" letter-spacing="2.5" fill="#F0A64B" font-family="'SF Mono', Menlo, Consolas, monospace">HANDOFFBASE MCP SERVER</text>
  <text x="1216" y="240" font-size="13" fill="#8A7A5F" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace">/mcp</text>

  <!-- surface -->
  <rect x="664" y="260" width="552" height="92" rx="10" fill="#2A2015" stroke="#44351F"/>
  <text x="688" y="296" font-size="19" fill="#F2E7D5">MCP surface</text>
  <text x="688" y="326" font-size="15" fill="#B3A186"><tspan fill="#F0A64B" font-weight="600">9</tspan> tools · <tspan fill="#F0A64B" font-weight="600">9</tspan> memory:// resources · <tspan fill="#F0A64B" font-weight="600">4</tspan> prompts</text>

  <line x1="940" y1="352" x2="940" y2="380" stroke="#C99B57" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- service -->
  <rect x="664" y="384" width="552" height="80" rx="10" fill="#2A2015" stroke="#44351F"/>
  <text x="688" y="416" font-size="19" fill="#F2E7D5">Memory service layer</text>
  <text x="688" y="444" font-size="14" fill="#8A7A5F">approval gates · scope isolation · token budgets</text>

  <line x1="940" y1="464" x2="940" y2="492" stroke="#C99B57" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- core -->
  <rect x="664" y="496" width="552" height="132" rx="10" fill="#2A2015" stroke="#44351F"/>
  <text x="688" y="530" font-size="19" fill="#F2E7D5">Memory core</text>
  <text x="688" y="557" font-size="14" fill="#8A7A5F">records · lifecycle · validation · scopes — provider-agnostic</text>
  <g font-size="12.5" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#B3A186">
    <rect x="688" y="574" width="76" height="32" rx="7" fill="#221A10" stroke="#44351F"/>
    <text x="726" y="595" text-anchor="middle">events</text>
    <rect x="772" y="574" width="76" height="32" rx="7" fill="#221A10" stroke="#44351F"/>
    <text x="810" y="595" text-anchor="middle">traces</text>
    <rect x="856" y="574" width="102" height="32" rx="7" fill="#221A10" stroke="#44351F"/>
    <text x="907" y="595" text-anchor="middle">conflicts</text>
    <rect x="966" y="574" width="102" height="32" rx="7" fill="#221A10" stroke="#44351F"/>
    <text x="1017" y="595" text-anchor="middle">feedback</text>
  </g>

  <line x1="940" y1="628" x2="940" y2="656" stroke="#C99B57" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="960" y="650" font-size="13" fill="#8A7A5F" font-family="'SF Mono', Menlo, Consolas, monospace">MemoryStore</text>

  <!-- stores -->
  <rect x="664" y="660" width="266" height="100" rx="10" fill="#2A2015" stroke="#44351F"/>
  <text x="688" y="694" font-size="17" fill="#F2E7D5">In-memory</text>
  <rect x="782" y="678" width="72" height="24" rx="6" fill="#26301F" stroke="#3D4A32"/>
  <text x="818" y="695" font-size="12" fill="#8FBF8A" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">default</text>
  <text x="688" y="724" font-size="13.5" fill="#8A7A5F">credential-free · local + CI</text>

  <rect x="950" y="660" width="266" height="100" rx="10" fill="#2A2015" stroke="#5A4526" stroke-width="1.5"/>
  <text x="974" y="694" font-size="17" fill="#F2E7D5">Postgres + pgvector</text>
  <text x="974" y="724" font-size="13.5" fill="#8A7A5F">durable · semantic recall</text>
  <rect x="974" y="734" width="60" height="20" rx="5" fill="#33270F" stroke="#5A4526"/>
  <text x="1004" y="748" font-size="11" fill="#F0A64B" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">live</text>

  <!-- footer of server box -->
  <text x="664" y="846" font-size="13.5" fill="#8A7A5F">every recall returns a trace id — used, ignored, excluded, with reasons</text>

  <!-- ============ PROVIDER BOUNDARY ============ -->
  <rect x="1300" y="200" width="556" height="340" rx="14" fill="#201810" stroke="#372B1C" stroke-width="1.5"/>
  <text x="1324" y="240" font-size="13" letter-spacing="2.5" fill="#F0A64B" font-family="'SF Mono', Menlo, Consolas, monospace">REASONING PROVIDER BOUNDARY</text>

  <rect x="1324" y="258" width="508" height="56" rx="10" fill="#2A2015" stroke="#44351F"/>
  <text x="1348" y="293" font-size="17" fill="#F2E7D5" font-family="'SF Mono', Menlo, Consolas, monospace">MemoryReasoningProvider</text>

  <line x1="1480" y1="314" x2="1480" y2="338" stroke="#C99B57" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1752" y1="314" x2="1752" y2="338" stroke="#6B5A41" stroke-width="1.8" marker-end="url(#arrowDim)"/>

  <rect x="1324" y="342" width="332" height="104" rx="10" fill="#2E2210" stroke="#F0A64B" stroke-width="1.8"/>
  <text x="1348" y="376" font-size="17" fill="#F2E7D5" font-family="'SF Mono', Menlo, Consolas, monospace">QwenMemoryProvider</text>
  <text x="1348" y="402" font-size="13" fill="#B3A186">extraction · classification · conflicts</text>
  <text x="1348" y="424" font-size="13" fill="#B3A186">context packs · reflection · explanations</text>

  <rect x="1672" y="342" width="160" height="104" rx="10" fill="#2A2015" stroke="#44351F"/>
  <text x="1752" y="380" font-size="14.5" fill="#F2E7D5" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">MockProvider</text>
  <text x="1752" y="404" font-size="12" fill="#8A7A5F" text-anchor="middle">deterministic</text>
  <text x="1752" y="422" font-size="12" fill="#8A7A5F" text-anchor="middle">CI · no credentials</text>

  <line x1="1480" y1="446" x2="1480" y2="474" stroke="#C99B57" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- qwen cloud badge -->
  <rect x="1324" y="478" width="508" height="38" rx="9" fill="#E9A23B"/>
  <text x="1348" y="503" font-size="16" font-weight="700" fill="#221806">Qwen Cloud</text>
  <text x="1808" y="503" font-size="12.5" fill="#3D2B0E" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace">qwen-plus · text-embedding-v4</text>

  <!-- service -> provider arrow -->
  <path d="M 1240 424 C 1272 424, 1272 424, 1296 424" stroke="#C99B57" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>

  <!-- ============ DASHBOARD ============ -->
  <rect x="1300" y="580" width="556" height="300" rx="14" fill="#201810" stroke="#372B1C" stroke-width="1.5"/>
  <text x="1324" y="620" font-size="13" letter-spacing="2.5" fill="#F0A64B" font-family="'SF Mono', Menlo, Consolas, monospace">MEMORY VAULT DASHBOARD</text>
  <text x="1324" y="652" font-size="15" fill="#B3A186">humans govern what agents remember</text>

  <g font-size="14" fill="#F2E7D5">
    <rect x="1324" y="672" width="154" height="44" rx="9" fill="#2A2015" stroke="#44351F"/>
    <text x="1401" y="700" text-anchor="middle">Pending review</text>
    <rect x="1490" y="672" width="120" height="44" rx="9" fill="#2A2015" stroke="#44351F"/>
    <text x="1550" y="700" text-anchor="middle">Conflicts</text>
    <rect x="1622" y="672" width="100" height="44" rx="9" fill="#2A2015" stroke="#44351F"/>
    <text x="1672" y="700" text-anchor="middle">Traces</text>
    <rect x="1734" y="672" width="98" height="44" rx="9" fill="#2A2015" stroke="#44351F"/>
    <text x="1783" y="700" text-anchor="middle">Audit log</text>
  </g>

  <text x="1324" y="756" font-size="13.5" fill="#8A7A5F">approve · reject · supersede · merge · invalidate · delete</text>
  <text x="1324" y="800" font-size="13" fill="#8A7A5F" font-family="'SF Mono', Menlo, Consolas, monospace">same-origin API · caller-bound mutations</text>
  <text x="1324" y="822" font-size="13" fill="#8A7A5F" font-family="'SF Mono', Menlo, Consolas, monospace">caller-scoped snapshots</text>

  <!-- dashboard -> service arrow -->
  <path d="M 1296 730 C 1264 730, 1264 700, 1240 690" stroke="#6B5A41" stroke-width="1.8" fill="none" stroke-dasharray="6 5" marker-end="url(#arrowDim)"/>

  <!-- ============ ALIBABA CLOUD BAND ============ -->
  <rect x="64" y="920" width="1792" height="100" rx="14" fill="#1D1913" stroke="#4A3A24" stroke-width="1.5"/>
  <text x="96" y="960" font-size="13" letter-spacing="2.5" fill="#F0A64B" font-family="'SF Mono', Menlo, Consolas, monospace">LIVE ON ALIBABA CLOUD INTERNATIONAL</text>
  <text x="96" y="992" font-size="16" fill="#F2E7D5">Singapore ECS · Docker · Caddy HTTPS · Postgres/pgvector — durable single-host persistence, validated July 2026</text>
  <text x="1824" y="992" font-size="13" fill="#8A7A5F" text-anchor="end">honest scope: no custom domain · no load balancer · no managed HA database</text>

  <!-- band connector -->
  <line x1="940" y1="916" x2="940" y2="886" stroke="#6B5A41" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrowDim)"/>
</svg>
