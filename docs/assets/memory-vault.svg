    <line x1="384" y1="396" x2="1068" y2="396" stroke="#1c1f25" stroke-width="1"/>

    <!-- rows -->
    <!-- row 1 -->
    <g>
      <text x="384" y="424" fill="#e6e8eb" font-size="13.5">User prioritizes AI hackathons that improve credentials,</text>
      <text x="384" y="442" fill="#5f6672" font-size="11.5" font-family="ui-monospace, Menlo, monospace">mem_user_pref_001</text>
      <rect x="712" y="414" width="92" height="24" rx="6" fill="#1a1d23"/>
      <text x="758" y="431" fill="#c3c8d0" font-size="11.5" text-anchor="middle">user preference</text>
      <text x="840" y="424" fill="#9aa0aa" font-size="12">demo-user /</text>
      <text x="840" y="440" fill="#9aa0aa" font-size="12">opportunity-scout / codex</text>
      <rect x="1010" y="414" width="58" height="24" rx="12" fill="#0f2a20"/>
      <text x="1039" y="431" fill="#34d399" font-size="11.5" text-anchor="middle">active</text>
    </g>
    <line x1="384" y1="460" x2="1068" y2="460" stroke="#171a20" stroke-width="1"/>
    <!-- row 2 -->
