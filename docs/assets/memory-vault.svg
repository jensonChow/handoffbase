      <text x="66" y="214">Pending Review</text>
      <rect x="270" y="196" width="34" height="24" rx="7" fill="#171a20"/>
      <text x="287" y="213" fill="#9aa0aa" font-size="13" font-weight="600" text-anchor="middle">2</text>

      <rect x="34" y="252" width="16" height="16" rx="4" fill="none" stroke="#6b7280" stroke-width="1.8"/>
      <text x="66" y="266">Memory Trace</text>
      <rect x="270" y="248" width="34" height="24" rx="7" fill="#171a20"/>
      <text x="287" y="265" fill="#9aa0aa" font-size="13" font-weight="600" text-anchor="middle">2</text>

      <rect x="34" y="304" width="16" height="16" rx="4" fill="none" stroke="#6b7280" stroke-width="1.8"/>
      <text x="66" y="318">Conflicts</text>
      <rect x="270" y="300" width="34" height="24" rx="7" fill="#171a20"/>
      <text x="287" y="317" fill="#9aa0aa" font-size="13" font-weight="600" text-anchor="middle">1</text>

      <rect x="34" y="356" width="16" height="16" rx="4" fill="none" stroke="#6b7280" stroke-width="1.8"/>
      <text x="66" y="370">Audit / Deletes</text>
