<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" role="img" aria-label="HandoffBase Memory Vault dashboard showing six governed agent memories, stat tiles, and a detail editor">
  <defs>
    <clipPath id="frame"><rect x="0" y="0" width="1600" height="900" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
