      <path d="M37 48 v9 a11 4.5 0 0 0 22 0 v-9"/>
    </g>
    <text x="84" y="45" fill="#34d399" font-size="11" letter-spacing="1.5" font-weight="600">HANDOFFBASE</text>
    <text x="84" y="67" fill="#eceef1" font-size="19" font-weight="700">Memory Vault</text>

    <!-- nav: selected item -->
    <rect x="16" y="128" width="304" height="52" rx="10" fill="#191c22"/>
    <rect x="16" y="128" width="3.5" height="52" rx="2" fill="#34d399"/>
    <rect x="34" y="146" width="16" height="16" rx="4" fill="none" stroke="#34d399" stroke-width="1.8"/>
    <text x="66" y="160" fill="#eceef1" font-size="15" font-weight="600">Memory Vault</text>
    <rect x="270" y="142" width="34" height="24" rx="7" fill="#22262e"/>
    <text x="287" y="159" fill="#c3c8d0" font-size="13" font-weight="600" text-anchor="middle">6</text>

    <!-- nav items -->
