      <rect x="712" y="546" width="88" height="24" rx="6" fill="#1a1d23"/>
      <text x="756" y="563" fill="#c3c8d0" font-size="11.5" text-anchor="middle">tool memory</text>
      <text x="840" y="556" fill="#9aa0aa" font-size="12">demo-user /</text>
      <text x="840" y="572" fill="#9aa0aa" font-size="12">opportunity-scout / devpost</text>
      <rect x="1010" y="546" width="58" height="24" rx="12" fill="#0f2a20"/>
      <text x="1039" y="563" fill="#34d399" font-size="11.5" text-anchor="middle">active</text>
    </g>
    <line x1="384" y1="592" x2="1068" y2="592" stroke="#171a20" stroke-width="1"/>
    <!-- row 4 -->
    <g>
      <text x="384" y="622" fill="#e6e8eb" font-size="13.5">Do not recommend competitions when official eligibility</text>
      <text x="384" y="640" fill="#5f6672" font-size="11.5" font-family="ui-monospace, Menlo, monospace">mem_pending_004</text>
      <rect x="712" y="612" width="98" height="24" rx="6" fill="#1a1d23"/>
      <text x="761" y="629" fill="#c3c8d0" font-size="11.5" text-anchor="middle">failure memory</text>
      <text x="840" y="622" fill="#9aa0aa" font-size="12">demo-user / ai-event-2026</text>
      <text x="840" y="638" fill="#9aa0aa" font-size="12">/ opportunity-scout</text>
      <rect x="1010" y="612" width="66" height="24" rx="12" fill="#2b2109"/>
      <text x="1043" y="629" fill="#fbbf24" font-size="11.5" text-anchor="middle">pending</text>
    </g>
    <line x1="384" y1="658" x2="1068" y2="658" stroke="#171a20" stroke-width="1"/>
    <!-- row 5 -->
    <g>
      <text x="384" y="688" fill="#e6e8eb" font-size="13.5">When eligible opportunities compete, rank founder network</text>
      <text x="384" y="706" fill="#5f6672" font-size="11.5" font-family="ui-monospace, Menlo, monospace">mem_pending_005</text>
      <rect x="712" y="678" width="72" height="24" rx="6" fill="#1a1d23"/>
      <text x="748" y="695" fill="#c3c8d0" font-size="11.5" text-anchor="middle">procedure</text>
      <text x="840" y="688" fill="#9aa0aa" font-size="12">demo-user / ai-event-2026</text>
      <text x="840" y="704" fill="#9aa0aa" font-size="12">/ opportunity-scout / codex</text>
      <rect x="1010" y="678" width="66" height="24" rx="12" fill="#2b2109"/>
      <text x="1043" y="695" fill="#fbbf24" font-size="11.5" text-anchor="middle">pending</text>
    </g>
    <line x1="384" y1="724" x2="1068" y2="724" stroke="#171a20" stroke-width="1"/>
    <!-- row 6 (superseded, faded to imply scroll) -->
    <g opacity="0.62">
      <text x="384" y="754" fill="#cdd2d9" font-size="13.5">User appears to prioritize hackathon prize money when</text>
      <text x="384" y="772" fill="#5f6672" font-size="11.5" font-family="ui-monospace, Menlo, monospace">mem_expired_006</text>
      <rect x="712" y="744" width="112" height="24" rx="6" fill="#1a1d23"/>
      <text x="768" y="761" fill="#c3c8d0" font-size="11.5" text-anchor="middle">decision memory</text>
      <text x="840" y="754" fill="#9aa0aa" font-size="12">demo-user / opportunity-scout</text>
      <rect x="1010" y="744" width="86" height="24" rx="12" fill="#1f2229"/>
      <text x="1053" y="761" fill="#9aa0aa" font-size="11.5" text-anchor="middle">superseded</text>
    </g>
    <!-- fade overlay at bottom of list -->
    <rect x="361" y="800" width="730" height="59" fill="#101216" opacity="0.85"/>

    <!-- ============ DETAIL PANEL ============ -->
    <rect x="1108" y="228" width="468" height="632" rx="14" fill="#101216" stroke="#22252c"/>
    <text x="1132" y="266" fill="#7d838d" font-size="11" letter-spacing="1.2" font-weight="600">DETAIL / EDIT</text>
    <rect x="1488" y="250" width="64" height="24" rx="12" fill="#0f2a20"/>
    <text x="1520" y="267" fill="#34d399" font-size="11.5" text-anchor="middle">active</text>
    <text x="1132" y="298" fill="#eceef1" font-size="19" font-weight="700" font-family="ui-monospace, Menlo, monospace">mem_user_pref_001</text>

    <text x="1132" y="330" fill="#9aa0aa" font-size="12.5">Canonical memory text</text>
    <rect x="1132" y="342" width="420" height="118" rx="9" fill="#0b0d10" stroke="#23262d"/>
    <text x="1150" y="372" fill="#dfe3e8" font-size="13.5">User prioritizes AI hackathons that improve</text>
    <text x="1150" y="394" fill="#dfe3e8" font-size="13.5">credentials, founder network, and useful startup</text>
    <text x="1150" y="416" fill="#dfe3e8" font-size="13.5">resources over prize money alone.</text>

    <!-- confidence / importance -->
    <text x="1132" y="500" fill="#9aa0aa" font-size="12.5">Confidence 96%</text>
    <rect x="1132" y="510" width="196" height="6" rx="3" fill="#1c2027"/>
    <rect x="1132" y="510" width="188" height="6" rx="3" fill="#2f6df6"/>
    <circle cx="1320" cy="513" r="8" fill="#e6e8eb"/>
    <text x="1356" y="500" fill="#9aa0aa" font-size="12.5">Importance 90%</text>
    <rect x="1356" y="510" width="196" height="6" rx="3" fill="#1c2027"/>
    <rect x="1356" y="510" width="176" height="6" rx="3" fill="#2f6df6"/>
    <circle cx="1532" cy="513" r="8" fill="#e6e8eb"/>

    <!-- meta rows -->
    <line x1="1132" y1="556" x2="1552" y2="556" stroke="#1c1f25"/>
    <text x="1132" y="586" fill="#7d838d" font-size="12">Type / lifecycle</text>
    <text x="1552" y="586" fill="#c8cdd4" font-size="12.5" text-anchor="end">user preference / active</text>
    <text x="1132" y="620" fill="#7d838d" font-size="12">Scope</text>
    <text x="1552" y="620" fill="#c8cdd4" font-size="12.5" text-anchor="end">demo-user / opportunity-scout / codex</text>
    <text x="1132" y="654" fill="#7d838d" font-size="12">Source</text>
    <text x="1552" y="654" fill="#c8cdd4" font-size="12.5" text-anchor="end">user correction / Session 1</text>
    <line x1="1132" y1="678" x2="1552" y2="678" stroke="#1c1f25"/>

    <!-- action buttons -->
    <rect x="1132" y="700" width="132" height="42" rx="9" fill="#123a2a"/>
    <text x="1198" y="726" fill="#34d399" font-size="14" font-weight="600" text-anchor="middle">Save</text>
    <rect x="1276" y="700" width="132" height="42" rx="9" fill="#0b0d10" stroke="#2a2e36"/>
    <text x="1342" y="726" fill="#c3c8d0" font-size="14" text-anchor="middle">Invalidate</text>
    <rect x="1420" y="700" width="132" height="42" rx="9" fill="#0b0d10" stroke="#3a2326"/>
    <text x="1486" y="726" fill="#f87171" font-size="14" text-anchor="middle">Delete</text>

    <!-- audit note -->
    <text x="1132" y="782" fill="#7d838d" font-size="12">Audit events · 1</text>
    <circle cx="1138" cy="812" r="4" fill="#34d399"/>
    <text x="1152" y="817" fill="#c3c8d0" font-size="12.5">created — extracted durable user preference</text>
    <text x="1152" y="837" fill="#6b7280" font-size="11.5">agent:opportunity-scout · Jul 6, 03:15 AM</text>
  </g>
  <rect x="0.5" y="0.5" width="1599" height="899" rx="16" fill="none" stroke="#2a2e36" stroke-width="1"/>
</svg>
