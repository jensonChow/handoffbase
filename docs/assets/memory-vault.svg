    <circle cx="34" cy="822" r="4" fill="#34d399"/>
    <text x="48" y="827" fill="#c3c8d0" font-size="13" font-weight="600">Server in-memory</text>
    <text x="24" y="852" fill="#6b7280" font-size="12">Same-origin API. Changes survive refresh</text>
    <text x="24" y="870" fill="#6b7280" font-size="12">while this server process stays alive.</text>

    <!-- ============ MAIN HEADER ============ -->
    <text x="360" y="46" fill="#6b7280" font-size="11" letter-spacing="1.5" font-weight="600">HANDOFFBASE MEMORY VAULT</text>
    <text x="360" y="82" fill="#f2f4f7" font-size="30" font-weight="700">Inspect Memories</text>
    <!-- tenant pill + refresh -->
    <rect x="1236" y="46" width="230" height="38" rx="9" fill="#14161b" stroke="#23262d"/>
    <path d="M1256 58 l7 -4 7 4 v8 l-7 4 -7 -4 z" fill="none" stroke="#34d399" stroke-width="1.6"/>
    <text x="1282" y="70" fill="#c3c8d0" font-size="13.5">demo-tenant / demo-user</text>
    <rect x="1478" y="46" width="98" height="38" rx="9" fill="#1c1f26" stroke="#2a2e36"/>
    <text x="1527" y="70" fill="#e6e8eb" font-size="14" text-anchor="middle">Refresh</text>

