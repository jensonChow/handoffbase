      <text x="382" y="188" fill="#f2f4f7" font-size="30" font-weight="700">6</text>

      <rect x="606" y="112" width="230" height="92" rx="12" fill="#131519" stroke="#22252c"/>
      <text x="628" y="146" fill="#9aa0aa" font-size="13">Active</text>
      <text x="628" y="188" fill="#34d399" font-size="30" font-weight="700">3</text>

      <rect x="852" y="112" width="230" height="92" rx="12" fill="#131519" stroke="#22252c"/>
      <text x="874" y="146" fill="#9aa0aa" font-size="13">Pending review</text>
      <text x="874" y="188" fill="#f59e0b" font-size="30" font-weight="700">2</text>

      <rect x="1098" y="112" width="230" height="92" rx="12" fill="#131519" stroke="#22252c"/>
      <text x="1120" y="146" fill="#9aa0aa" font-size="13">Inactive memories</text>
      <text x="1120" y="188" fill="#f87171" font-size="30" font-weight="700">1</text>

      <rect x="1344" y="112" width="222" height="92" rx="12" fill="#131519" stroke="#22252c"/>
      <text x="1366" y="146" fill="#9aa0aa" font-size="13">Trace runs</text>
      <text x="1366" y="188" fill="#a78bfa" font-size="30" font-weight="700">2</text>
