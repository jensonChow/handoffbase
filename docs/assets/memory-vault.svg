      <text x="384" y="508" fill="#5f6672" font-size="11.5" font-family="ui-monospace, Menlo, monospace">mem_proc_002</text>
      <rect x="712" y="480" width="72" height="24" rx="6" fill="#1a1d23"/>
      <text x="748" y="497" fill="#c3c8d0" font-size="11.5" text-anchor="middle">procedure</text>
      <text x="840" y="490" fill="#9aa0aa" font-size="12">demo-user / ai-event-2026</text>
      <text x="840" y="506" fill="#9aa0aa" font-size="12">/ opportunity-scout</text>
      <rect x="1010" y="480" width="58" height="24" rx="12" fill="#0f2a20"/>
      <text x="1039" y="497" fill="#34d399" font-size="11.5" text-anchor="middle">active</text>
    </g>
    <line x1="384" y1="526" x2="1068" y2="526" stroke="#171a20" stroke-width="1"/>
    <!-- row 3 -->
